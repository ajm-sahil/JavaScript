<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Object</title>
  </head>
  <body>
    <script>
      let product = {
        company: "Mango",
        price: 861,
        item_name: "T-shirt",
        "item-name": "Shirt",
      };
      console.log(product);
      console.log(typeof product);
      console.log(
        product.company + " " + product.item_name + " " + product.price,
      );
      product.company = "Banana";

      let propertyName = "item-name";

      console.log(
        product.company +
          " " +
          product.item_name +
          " " +
          product.price +
          " " +
          product["item-name"] +
          " " +
          product[propertyName],
      );

      delete product.company;
      console.log(
        product.item_name +
          " " +
          product.price +
          " " +
          product["item-name"] +
          " " +
          product[propertyName],
      );
    </script>
  </body>
</html>
