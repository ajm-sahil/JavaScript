<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Game</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }

      h1 {
        color: #333;
      }

      button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Bat Ball Stump Game</h1>
    <button
      onclick="
        let userChoice = 'You have chosen Bat';
        let computerChoice = generateComputerChoice();
        let computerChoiceMessage = `Computer chose is ${computerChoice}`;

        let resultMessage = '';
        if (computerChoice === 'Bat') {
          resultMessage = 'It\'s a tie!';
        } else if (computerChoice === 'Ball') {
          resultMessage = 'User have win!';
        } else {
          resultMessage = 'Computer have win!';
        }
        alert(`${userChoice}\n${computerChoiceMessage}\n${resultMessage}`);
      "
    >
      Bat
    </button>

    <button
      onclick="
        userChoice = 'You have chosen Ball';
        computerChoice = generateComputerChoice();
        computerChoiceMessage = `Computer chose is ${computerChoice}`;
        resultMessage = '';
        if (computerChoice === 'Bat') {
          resultMessage = 'Computer have win!';
        } else if (computerChoice === 'Ball') {
          resultMessage = 'it\'s a tie!';
        } else {
          resultMessage = 'User have win!';
        }
        alert(`${userChoice}\n${computerChoiceMessage}\n${resultMessage}`);
      "
    >
      Ball
    </button>

    <button
      onclick="
        userChoice = 'You have chosen Stump';
        computerChoice = generateComputerChoice();
        computerChoiceMessage = `Computer chose is ${computerChoice}`;
        resultMessage = '';
        if (computerChoice === 'Bat') {
          resultMessage = 'Computer have win!';
        } else if (computerChoice === 'Ball') {
          resultMessage = 'Computer have win!';
        } else {
          resultMessage = 'It\'s a tie!';
        }

        alert(`${userChoice}\n${computerChoiceMessage}\n${resultMessage}`);
      "
    >
      Stump
    </button>
    <script>
      function generateComputerChoice() {
        let randomNumber = Math.floor(Math.random() * 3);
        if (randomNumber > 0 && randomNumber <= 1) {
          return "Bat";
        } else if (randomNumber > 1 && randomNumber <= 2) {
          return "Ball";
        } else {
          return "Stump";
        }
      }
    </script>
  </body>
</html>
