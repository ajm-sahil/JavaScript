<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boolean</title>
  </head>
  <body>
    <script>
      console.log(5 > 3); // true
      console.log(5 < 3); // false

      console.log(5 >= 3); // true
      console.log(5 <= 3); // false
      console.log(5 === 3); // false
      console.log(5 !== 3); // true

      console.log(5 == 5.0); // true
      console.log(5 === 5.0); // true

      console.log("Checking if you can drive");
      let age = 20;
      if (age >= 18) {
        console.log("You can drive");
      } else {
        console.log("You cannot drive");
      }

      if (age >= 18) console.log("You can drive");
      else console.log("You cannot drive");

      age = 15;

      if (age >= 18) {
        console.log("You can drive");
      } else if (age >= 16) {
        console.log("You can drive with supervision");
      } else {
        console.log("You cannot drive");
      }
    </script>
  </body>
</html>
